<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;src:url('./fonts/fraunces-normal-latin.woff2');font-weight:100 900}
@font-face{font-family:Fraunces;font-style:italic;src:url('./fonts/fraunces-italic-latin.woff2');font-weight:100 900}
@font-face{font-family:Inst;src:url('./fonts/instrument-sans-normal-latin.woff2');font-weight:400 700}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:900px;overflow:hidden;background:radial-gradient(120% 90% at 85% 15%,#12346288 0%,transparent 55%),linear-gradient(160deg,#0b1c35 0%,#071427 60%);font-family:Inst;color:#eaf2ff;position:relative}
.mt{position:absolute;left:0;right:0;bottom:0;height:300px}
.logo{position:absolute;right:90px;top:110px;width:330px;height:330px;border-radius:50%;background:url(logo.jpeg) center/122% no-repeat;box-shadow:0 0 0 1px #1d3255,0 30px 80px #00000080}
.tx{position:absolute;left:90px;top:120px;width:640px}
.eb{font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:#6cc4ff;font-weight:600}
h1{font-family:Fraunces;font-weight:700;font-size:78px;line-height:1.04;margin-top:26px;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:500;color:#6cc4ff}
.rg{width:90px;height:4px;background:#6cc4ff;margin:36px 0 26px}
.sb{font-size:28px;color:#9db1cf;line-height:1.35}
.ft{position:absolute;left:90px;bottom:62px;font-size:24px;color:#eaf2ff;font-weight:600;letter-spacing:.04em}
.ft span{color:#6cc4ff}
</style></head><body>
<svg class="mt" viewBox="0 0 1200 300" preserveAspectRatio="none"><polygon points="0,300 0,210 230,120 400,190 620,70 830,180 1000,110 1200,200 1200,300" fill="#123462" opacity=".55"/><polygon points="0,300 0,250 280,180 520,240 760,150 980,230 1200,190 1200,300" fill="#0b1c35"/></svg>
<div class="logo"></div>
<div class="tx"><div class="eb">On The Top Media</div>
<h1>Seu negócio no <em>topo</em> de quem procura por ele.</h1>
<div class="rg"></div><div class="sb">Google Meu Negócio, sites e<br>SEO local em Porto Alegre.</div></div>
<div class="ft">onthetopmedia.com <span>·</span> Porto Alegre</div>
</body></html>
